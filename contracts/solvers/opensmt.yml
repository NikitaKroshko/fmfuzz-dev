solver_name: opensmt
repository_url: https://github.com/usi-verification-and-security/OpenSMT.git
issues_url: null
build_script: scripts/opensmt/build.sh
production_binary_path: build/bin/opensmt
coverage_binary_path: build/bin/opensmt
tests_script: scripts/opensmt/tests.sh
seeds_dir: FUZZING_SEEDS
target_commands:
  - "{reference_binary} --check-models --check-proofs --strings-exp"
  - "{target_binary}"
reference_setup_command: python3 scripts/download_cvc5.py {workspace_root}/reference-bin
reference_binary_path: "{workspace_root}/reference-bin/cvc5"
oracle_command: python3 scripts/oracle.py --cvc5-path {reference_binary} --solver-path {target_binary} {test_file}
coverage_target_job_count: 4
coverage_average_test_time_seconds: 12.0
coverage_mapper_command: python3 scripts/opensmt/coverage/coverage_mapper.py --build-dir {build_dir} --opensmt-dir {solver_workspace}
commit_prepare_command: python3 scripts/opensmt/commit_fuzzer/prepare_commit_fuzzer.py --opensmt-dir {solver_workspace}
regression_kind: per-test
regression_command: {target_binary} {test_path}
regression_working_directory: build
regression_timeout_seconds: 120
environment_requirements:
  packages:
    - build-essential
    - cmake
    - git
    - python3
    - libgmp-dev
    - flex
    - bison
  env:
    - GCOV_PREFIX
    - GCOV_PREFIX_STRIP
artifact_paths:
  - build/bin/opensmt
  - build/compile_commands.json
  - build/include
  - build/src
  - build/deps
artifact_s3_bucket: null
artifact_s3_prefix: null
