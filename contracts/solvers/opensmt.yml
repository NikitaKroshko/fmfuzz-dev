solver_name: opensmt
repository_url: https://github.com/usi-verification-and-security/OpenSMT.git
repository_path: opensmt
issues_url: null
tests_repository_url: null
tests_repository_path: null
build_command: scripts/opensmt/build.sh
coverage_build_command: scripts/opensmt/build.sh --instrumentation
production_binary_path: build/bin/opensmt
coverage_binary_path: build/bin/opensmt
test_root: test/regression
test_discovery_command: scripts/opensmt/test.sh --discover
target_commands:
  - "{reference_binary} --check-models --check-proofs --strings-exp"
  - "{target_binary}"
oracle_command: python3 scripts/oracle.py --cvc5-path {reference_binary} --solver-path {target_binary} {test_file}
environment_requirements:
  packages:
    - build-essential
    - cmake
    - git
    - python3
    - libgmp-dev
    - flex
    - bison
  env:
    - GCOV_PREFIX
    - GCOV_PREFIX_STRIP
artifact_paths:
  - build/bin/opensmt
  - build/compile_commands.json
  - build/include
  - build/src
  - build/deps
artifact_s3_bucket: null
artifact_s3_prefix: null
