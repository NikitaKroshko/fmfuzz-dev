solver_name: z3
repository_url: https://github.com/Z3Prover/z3.git
issues_url: null
tests_repository_url: https://github.com/z3prover/z3test.git
tests_repository_path: z3test
build_script: scripts/z3/build.sh
production_binary_path: build/z3
coverage_binary_path: build/z3
tests_script: scripts/z3/tests.sh
seeds_dir: FUZZING_SEEDS
target_commands:
  - "{target_binary} smt.threads=1 memory_max_size=2048 model_validate=true"
  - "{reference_binary} --check-models --check-proofs --strings-exp"
reference_setup_command: python3 scripts/download_cvc5.py {workspace_root}/reference-bin
reference_binary_path: "{workspace_root}/reference-bin/cvc5"
oracle_command: python3 scripts/oracle.py --cvc5-path {reference_binary} --solver-path {target_binary} --solver-flags model_validate=true {test_file}
coverage_target_job_count: 4
coverage_average_test_time_seconds: 9.5
coverage_mapper_command: python3 scripts/z3/coverage/coverage_mapper.py --build-dir {build_dir} --z3test-dir {tests_workspace} --cvc5-path {reference_binary}
commit_prepare_command: python3 scripts/z3/commit_fuzzer/prepare_commit_fuzzer.py
environment_requirements:
  packages:
    - build-essential
    - cmake
    - git
    - python3
  env:
    - GCOV_PREFIX
    - GCOV_PREFIX_STRIP
artifact_paths:
  - build/z3
  - build/compile_commands.json
  - build/include
  - build/src
artifact_s3_bucket: null
artifact_s3_prefix: null
