name: OpenSMT Manager

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Optional: Commit hash to add to build queue"
        required: false
        type: string
  schedule:
    - cron: "35 0,6,12,18 * * *"

jobs:
  manager:
    uses: ./.github/workflows/solver-manager.yml
    with:
      solver_name: opensmt
      contract_path: contracts/solvers/opensmt.yml
      commit_hash: ${{ inputs.commit_hash }}
    secrets: inherit
