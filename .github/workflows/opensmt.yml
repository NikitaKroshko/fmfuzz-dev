name: Build OpenSMT

on:
  workflow_dispatch:
    inputs:
      opensmt_commit_hash:
        description: "Optional: OpenSMT commit hash to add to build queue"
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/solver-build.yml
    with:
      solver_name: opensmt
      contract_path: contracts/solvers/opensmt.yml
      commit_hash: ${{ inputs.opensmt_commit_hash }}
    secrets: inherit
