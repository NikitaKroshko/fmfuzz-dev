name: Z3 Coverage Mapper

on:
  workflow_call:
    inputs:
      z3_commit_hash:
        description: "Z3 commit hash to build coverage for"
        required: false
        type: string
      test_count:
        description: "Pre-counted test count"
        required: false
        type: number
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_BUCKET:
        required: true
  workflow_dispatch:
    inputs:
      z3_commit_hash:
        description: "Optional: Z3 commit hash to build coverage mapping for"
        required: false
        type: string

jobs:
  map:
    uses: ./.github/workflows/solver-coverage-mapper.yml
    with:
      solver_name: z3
      contract_path: contracts/solvers/z3.yml
      commit_hash: ${{ inputs.z3_commit_hash }}
      test_count: ${{ inputs.test_count || 0 }}
    secrets: inherit
