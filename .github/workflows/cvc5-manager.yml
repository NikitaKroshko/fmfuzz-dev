name: CVC5 Manager

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional: Commit hash to add to build queue'
        required: false
        type: string

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read CVC5 contract
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            describe \
            --json > contract.json
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install boto3 GitPython requests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Run manager
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL=$(python3 -c "import json; print(json.load(open('contract.json'))['repository_url'])")
          if [ -n "${{ inputs.commit_hash }}" ]; then
            # Manual trigger: check for C++ changes before adding to build queue
            COMMIT_HASH="${{ inputs.commit_hash }}"
            if python3 scripts/scheduling/detect_cpp_changes.py "$REPO_URL" "$COMMIT_HASH" --token $GITHUB_TOKEN; then
              echo "✅ Commit $COMMIT_HASH has C++ changes, adding to build queue and fuzzing schedule"
              python3 scripts/scheduling/s3_state.py cvc5 build-queue add "$COMMIT_HASH"
              python3 scripts/scheduling/s3_state.py cvc5 fuzzing-schedule add "$COMMIT_HASH"
            else
              echo "❌ Commit $COMMIT_HASH has no C++ changes, skipping"
              exit 1
            fi
          else
            # Scheduled run: check commits and update queues
            python3 scripts/scheduling/manager.py cvc5 "$REPO_URL" --token $GITHUB_TOKEN
          fi
