name: CVC5 Commit Analyzer Test

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1'

jobs:
  commit-analyzer:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout CVC5 workspace
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            checkout \
            --json > checkout.json
      
      - name: Install LLVM/Clang 17
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Add LLVM to PATH
        run: echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH

      - name: Export LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV

      - name: Install system development packages
        run: |
          echo "Installing essential development packages..."
          sudo apt-get update
          
          # Install ONLY GCC 14 and essential packages (remove conflicting versions)
          sudo apt-get install -y \
            build-essential \
            libc6-dev \
            gcc \
            g++ \
            binutils \
            libstdc++-14-dev \
            libc++-dev \
            libc++abi-dev \
            zlib1g \
            zlib1g-dev
          
          echo "Installation completed"
      
      - name: Install Python dependencies
        run: |
          pip install gitpython unidiff "libclang==17.0.6"

      - name: Build cvc5 with coverage
        run: |
          # Set environment variables to ensure clang uses GCC 14 toolchain
          export CXX="clang++ --gcc-toolchain=/usr"
          export CC="clang --gcc-toolchain=/usr"
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            build \
            --mode instrumentation \
            --json > cvc5-build.json
      
      - name: Download coverage map
        uses: dawidd6/action-download-artifact@v6
        with:
          name: coverage-mapping
          path: .
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: cvc5-coverage-mapper.yml
      
      - name: Extract coverage map
        run: |
          gunzip coverage_mapping.json.gz
          ls -la coverage_mapping.json

      - name: Run Commit Fuzzer
        env:
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            prepare-commits \
            50 \
            --coverage-json coverage_mapping.json \
            --compile-commands cvc5/build \
            --min-overall-coverage 80
     
