name: CVC5 Regression Tests

on:
  workflow_dispatch:

jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [regress0, regress1, regress2, regress3, regress4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout CVC5 workspace
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            checkout \
            --json > checkout.json

      - name: Build CVC5 with coverage
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/cvc5.yml \
            build \
            --mode instrumentation \
            --json > cvc5-build.json

      - name: Run ${{ matrix.shard }} tests with timing
        run: |
          cd cvc5/build
          ../../scripts/measure_time.sh ../../scripts/cvc5/run_regression_tests.sh "${{ matrix.shard }}"
