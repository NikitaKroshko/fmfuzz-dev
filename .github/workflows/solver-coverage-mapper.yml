name: Solver Coverage Mapper

on:
  workflow_call:
    inputs:
      solver_name:
        required: true
        type: string
      contract_path:
        required: true
        type: string
      commit_hash:
        required: false
        type: string
      test_count:
        required: false
        type: number
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_BUCKET:
        required: true

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      total_tests: ${{ steps.generate-matrix.outputs.total_tests }}
      total_jobs: ${{ steps.generate-matrix.outputs.total_jobs }}
      commit_hash: ${{ steps.resolve-commit.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install psutil
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout solver workspace
        id: resolve-commit
        run: |
          CHECKOUT_ARGS=()
          if [ -n "${{ inputs.commit_hash }}" ]; then
            CHECKOUT_ARGS+=(--commit-hash "${{ inputs.commit_hash }}")
          fi
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            checkout \
            "${CHECKOUT_ARGS[@]}" \
            --json > checkout.json
          COMMIT_HASH=$(jq -r '.solver_commit_hash' checkout.json)
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

      - name: Validate contract after checkout
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            validate \
            --json > contract-validation.json

      - name: Build solver for test discovery
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            build \
            --mode production \
            --json > build.json

      - name: Generate coverage matrix
        id: generate-matrix
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            coverage-matrix \
            --output matrix.json
          MATRIX=$(jq -c '.matrix' matrix.json)
          TOTAL_TESTS=$(jq -r '.total_tests' matrix.json)
          TOTAL_JOBS=$(jq -r '.total_jobs' matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total_tests=$TOTAL_TESTS" >> "$GITHUB_OUTPUT"
          echo "total_jobs=$TOTAL_JOBS" >> "$GITHUB_OUTPUT"

  coverage-analysis:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install psutil requests antlr4-python3-runtime==4.9.2 "yinyang==0.3.0"
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout resolved commit
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            checkout \
            --commit-hash "${{ needs.discover-tests.outputs.commit_hash }}" \
            --json > checkout.json

      - name: Build solver with coverage
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            build \
            --mode instrumentation \
            --json > coverage-build.json

      - name: Set up reference binary
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            setup-reference \
            --json > reference.json

      - name: Run coverage analysis
        run: |
          REFERENCE_BINARY=$(jq -r '.reference_binary // empty' reference.json)
          TARGET_BINARY=$(jq -r '.binary_path' coverage-build.json)
          ARGS=()
          if [ -n "$REFERENCE_BINARY" ]; then
            ARGS+=(--reference-binary "$REFERENCE_BINARY")
          fi
          ${{ github.workspace }}/scripts/measure_time.sh \
            python3 \
            ${{ github.workspace }}/scripts/solver_fuzzing_brain.py \
            --contract "${{ github.workspace }}/${{ inputs.contract_path }}" \
            run-coverage-shard \
            --start-index ${{ matrix.start_index }} \
            --end-index ${{ matrix.end_index }} \
            --target-binary "$TARGET_BINARY" \
            --output "${{ github.workspace }}/coverage_mapping_${{ matrix.start_index }}_${{ matrix.end_index }}.json" \
            "${ARGS[@]}"

      - name: Upload coverage mapping
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mapping-${{ matrix.job_name }}
          path: coverage_mapping_${{ matrix.start_index }}_${{ matrix.end_index }}.json
          retention-days: 1

  join-mappings:
    runs-on: ubuntu-latest
    needs: [discover-tests, coverage-analysis]
    outputs:
      commit_hash: ${{ steps.use-commit.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use analyzed commit hash
        id: use-commit
        run: |
          COMMIT_HASH="${{ needs.discover-tests.outputs.commit_hash }}"
          if [ -z "$COMMIT_HASH" ]; then
            echo "❌ Missing analyzed commit hash"
            exit 1
          fi
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

      - name: Download all coverage mappings
        uses: actions/download-artifact@v4
        with:
          path: coverage-mappings

      - name: Join coverage mappings
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            join-coverage \
            --mappings-dir coverage-mappings \
            --output coverage_mapping.json

      - name: Upload final coverage mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mapping
          path: coverage_mapping.json.gz
          retention-days: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload final coverage mapping to S3
        run: |
          COMMIT_HASH="${{ steps.use-commit.outputs.commit_hash }}"
          S3_KEY="solvers/${{ inputs.solver_name }}/coverage-mappings/coverage_mapping-${COMMIT_HASH}.json.gz"
          aws s3api put-object \
            --bucket "${{ secrets.AWS_S3_BUCKET }}" \
            --key "$S3_KEY" \
            --body coverage_mapping.json.gz \
            --tagging "Type=CoverageMapping"

  update-state:
    runs-on: ubuntu-latest
    needs: [discover-tests, join-mappings]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update coverage state
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python3 scripts/coverage/coverage_state.py "${{ inputs.solver_name }}" update \
            --test-count ${{ needs.discover-tests.outputs.total_tests }} \
            --commit-hash ${{ needs.join-mappings.outputs.commit_hash }} \
            --updated-by "${{ github.workflow }}"
