name: OpenSMT Coverage Mapper

on:
  workflow_call:
    inputs:
      opensmt_commit_hash:
        description: "OpenSMT commit hash to build coverage for"
        required: false
        type: string
      test_count:
        description: "Pre-counted test count"
        required: false
        type: number
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_BUCKET:
        required: true
  workflow_dispatch:
    inputs:
      opensmt_commit_hash:
        description: "Optional: OpenSMT commit hash to build coverage mapping for"
        required: false
        type: string

jobs:
  map:
    uses: ./.github/workflows/solver-coverage-mapper.yml
    with:
      solver_name: opensmt
      contract_path: contracts/solvers/opensmt.yml
      commit_hash: ${{ inputs.opensmt_commit_hash }}
    secrets: inherit
