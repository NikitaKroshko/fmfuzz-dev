name: OpenSMT Commit Fuzzer

on:
  workflow_dispatch:
    inputs:
      opensmt_commit_hash:
        description: "Optional: OpenSMT commit hash to fuzz"
        required: false
        type: string
      smoke_test_limit:
        description: "Optional: run a local smoke fuzzer with this many tests"
        required: false
        type: number
        default: 0
      stop_buffer_minutes:
        description: "Minutes before timeout to stop fuzzing"
        required: false
        type: number
        default: 5
  schedule:
    - cron: "45 0,5,10,15,20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  run-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/solver-commit-fuzzer.yml
    with:
      solver_name: opensmt
      contract_path: contracts/solvers/opensmt.yml
      commit_hash: ${{ inputs.opensmt_commit_hash }}
      smoke_test_limit: ${{ inputs.smoke_test_limit }}
      stop_buffer_minutes: ${{ inputs.stop_buffer_minutes }}
    secrets: inherit

  run-scheduled:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/solver-commit-fuzzer.yml
    with:
      solver_name: opensmt
      contract_path: contracts/solvers/opensmt.yml
    secrets: inherit
