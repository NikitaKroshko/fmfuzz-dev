name: Build CVC5

on:
  workflow_dispatch:
    inputs:
      cvc5_commit_hash:
        description: "Optional: CVC5 commit hash to add to build queue"
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/solver-build.yml
    with:
      solver_name: cvc5
      contract_path: contracts/solvers/cvc5.yml
      commit_hash: ${{ inputs.cvc5_commit_hash }}
    secrets: inherit
