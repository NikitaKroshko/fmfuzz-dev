name: Build STP

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'  # Run every hour

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Restore solver state cache
        uses: actions/cache@v4
        id: cache-restore
        with:
          path: .cache
          key: solver-stp-latest
          restore-keys: |
            solver-stp-
      
      - name: Check for upstream changes
        id: check-upstream
        run: |
          ./scripts/check-upstream.sh stp https://github.com/stp/stp.git
          echo "build_needed=$(cat .build_status | grep build_needed | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "sha=$(cat .build_status | grep sha | cut -d'=' -f2)" >> $GITHUB_OUTPUT
      
      - name: Build STP
        if: steps.check-upstream.outputs.build_needed == 'true'
        run: ./scripts/stp/build.sh

      - name: Persist built SHA
        if: steps.check-upstream.outputs.build_needed == 'true'
        run: |
          mkdir -p .cache
          printf '%s\n' "${{ steps.check-upstream.outputs.sha }}" > .cache/stp_last_sha

      - name: Save solver state cache
        if: steps.check-upstream.outputs.build_needed == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: solver-stp-${{ steps.check-upstream.outputs.sha }}
      
      - name: Skip build (up to date)
        if: steps.check-upstream.outputs.build_needed == 'false'
        run: echo "✅ STP is up to date - skipping build"
