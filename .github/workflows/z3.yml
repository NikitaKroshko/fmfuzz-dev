name: Build Z3

on:
  workflow_dispatch:
    inputs:
      z3_commit_hash:
        description: "Optional: Z3 commit hash to add to build queue"
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/solver-build.yml
    with:
      solver_name: z3
      contract_path: contracts/solvers/z3.yml
      commit_hash: ${{ inputs.z3_commit_hash }}
    secrets: inherit
