name: Solver Coverage Daily Check

on:
  workflow_call:
    inputs:
      solver_name:
        required: true
        type: string
      contract_path:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_BUCKET:
        required: true

jobs:
  check-rebuild-needed:
    runs-on: ubuntu-latest
    outputs:
      should_rebuild: ${{ steps.check-state.outputs.should_rebuild }}
      reason: ${{ steps.check-state.outputs.reason }}
      test_count: ${{ steps.count-tests.outputs.test_count }}
      commit_hash: ${{ steps.count-tests.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install boto3 psutil
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout solver workspace
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            checkout \
            --json > checkout.json

      - name: Validate contract after checkout
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            validate \
            --json > contract-validation.json

      - name: Build solver for test counting
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract "${{ inputs.contract_path }}" \
            build \
            --mode production \
            --json > build.json

      - name: Count tests
        id: count-tests
        run: |
          python3 scripts/coverage/count_tests.py "${{ inputs.solver_name }}" \
            --contract "${{ inputs.contract_path }}" \
            --workspace-root "${{ github.workspace }}" \
            --output test-count.json
          TEST_COUNT=$(jq -r '.test_count' test-count.json)
          COMMIT_HASH=$(jq -r '.commit_hash' test-count.json)
          echo "test_count=$TEST_COUNT" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "✅ Found $TEST_COUNT tests at commit ${COMMIT_HASH:0:8}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check if rebuild needed
        id: check-state
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          python3 scripts/coverage/coverage_state.py "${{ inputs.solver_name }}" check \
            --test-count ${{ steps.count-tests.outputs.test_count }} \
            --commit-hash ${{ steps.count-tests.outputs.commit_hash }} \
            --output decision.json
          SHOULD_REBUILD=$(jq -r '.should_rebuild' decision.json)
          REASON=$(jq -r '.reason' decision.json)
          echo "should_rebuild=$SHOULD_REBUILD" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

  trigger-coverage-build:
    needs: check-rebuild-needed
    if: needs.check-rebuild-needed.outputs.should_rebuild == 'true'
    uses: ./.github/workflows/solver-coverage-mapper.yml
    with:
      solver_name: ${{ inputs.solver_name }}
      contract_path: ${{ inputs.contract_path }}
      commit_hash: ${{ needs.check-rebuild-needed.outputs.commit_hash }}
      test_count: ${{ fromJSON(needs.check-rebuild-needed.outputs.test_count) }}
    secrets: inherit

  skip-build:
    needs: check-rebuild-needed
    if: needs.check-rebuild-needed.outputs.should_rebuild == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        run: |
          echo "⏭️ Skipping coverage build"
          echo "Reason: ${{ needs.check-rebuild-needed.outputs.reason }}"
          echo "Test count: ${{ needs.check-rebuild-needed.outputs.test_count }}"
          echo "Commit: ${{ needs.check-rebuild-needed.outputs.commit_hash }}"
