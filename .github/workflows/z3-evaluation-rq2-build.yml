name: Z3 RQ2 Binary Building

on:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      total_commits: ${{ steps.generate-matrix.outputs.total_commits }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate build matrix
        id: generate-matrix
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          MATRIX=$(python3 scripts/evaluation/rq2/generate_build_matrix.py z3)
          COMMIT_COUNT=$(echo "$MATRIX" | python3 -c "import sys, json; data=json.load(sys.stdin); print(len(data['include']))")

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total_commits=$COMMIT_COUNT" >> $GITHUB_OUTPUT

          echo "✅ Generated matrix with $COMMIT_COUNT commits"
          echo "$MATRIX" | python3 -m json.tool

  build-binaries:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling and contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Prepare Z3 workspace for commit
        run: |
          COMMIT_HASH="${{ matrix.commit }}"
          echo "🔨 Building commit: $COMMIT_HASH"
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            checkout \
            --commit-hash "$COMMIT_HASH" \
            --json > checkout.json
          echo "Checked out commit: $(jq -r '.solver_commit_hash' checkout.json)"

      - name: Build Z3 production binary
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            build \
            --mode production \
            --build-arg=--static \
            --artifacts-dir .artifacts-production \
            --artifact-archive z3/build/artifacts-production.tar.gz \
            --json > production-build.json

      - name: Get commit hash
        id: get-commit
        working-directory: z3
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Z3 commit hash: $COMMIT_HASH"

      - name: Install LLVM/Clang 17 for coverage build
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Add LLVM to PATH
        run: echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH

      - name: Clean build for coverage
        run: |
          rm -rf z3/build

      - name: Build Z3 coverage binary
        run: |
          export CXX="clang++ --gcc-toolchain=/usr"
          export CC="clang --gcc-toolchain=/usr"
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            build \
            --mode instrumentation \
            --build-arg=--static \
            --artifacts-dir .artifacts-coverage \
            --artifact-archive z3/build/artifacts-coverage.tar.gz \
            --json > coverage-build.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload production binary to S3
        run: |
          COMMIT_HASH="${{ steps.get-commit.outputs.commit_hash }}"
          S3_KEY="evaluation/rq2/z3/builds/production/${COMMIT_HASH}.tar.gz"

          aws s3api put-object \
            --bucket ${{ secrets.AWS_S3_BUCKET }} \
            --key "$S3_KEY" \
            --body z3/build/artifacts-production.tar.gz

          echo "✅ Uploaded production binary to S3: $S3_KEY"

      - name: Upload coverage binary to S3
        run: |
          COMMIT_HASH="${{ steps.get-commit.outputs.commit_hash }}"
          S3_KEY="evaluation/rq2/z3/builds/coverage/${COMMIT_HASH}.tar.gz"

          aws s3api put-object \
            --bucket ${{ secrets.AWS_S3_BUCKET }} \
            --key "$S3_KEY" \
            --body z3/build/artifacts-coverage.tar.gz

          echo "✅ Uploaded coverage binary to S3: $S3_KEY"
