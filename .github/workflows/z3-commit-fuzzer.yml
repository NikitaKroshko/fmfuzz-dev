name: Z3 Commit Fuzzer

env:
  LOCAL_TEST_LIMIT: 16

on:
  workflow_dispatch:
    inputs:
      z3_commit_hash:
        description: "Optional: Z3 commit hash to fuzz (defaults to upstream HEAD)"
        required: false
        type: string
      stop_buffer_minutes:
        description: "Optional: Minutes before timeout to stop fuzzing (default: 5)"
        required: false
        type: number
        default: 5
  schedule:
    - cron: "45 0,5,10,15,20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  run-fuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install psutil requests antlr4-python3-runtime==4.9.2 "yinyang==0.3.0"

      - name: Install contract system dependencies
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            describe \
            --json > contract.json
          PACKAGES=$(jq -r '.environment_requirements.packages[]?' contract.json | tr '\n' ' ')
          if [ -n "$PACKAGES" ]; then
            sudo apt-get install -y $PACKAGES
          fi

      - name: Checkout Z3 workspace
        run: |
          CHECKOUT_ARGS=()
          if [ -n "${{ inputs.z3_commit_hash }}" ]; then
            CHECKOUT_ARGS+=(--commit-hash "${{ inputs.z3_commit_hash }}")
          fi
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            checkout \
            "${CHECKOUT_ARGS[@]}" \
            --json > z3-checkout.json

      - name: Install CVC5 reference binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/download_cvc5.py "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Z3 target binary
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            build \
            --mode production \
            --json > z3-build.json

      - name: Generate local test set
        run: |
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            matrix \
            --limit-tests "${LOCAL_TEST_LIMIT}" \
            --max-jobs 1 \
            --output matrix.json

      - name: Run local commit fuzzer
        run: |
          TEST_COUNT=$(jq -r '.total_tests' matrix.json)
          if [ "$TEST_COUNT" = "0" ]; then
            echo "No tests discovered"
            exit 0
          fi

          TESTS_JSON=$(jq -c '.matrix.include[0].tests' matrix.json)
          TARGET_BINARY=$(jq -r '.binary_path' z3-build.json)
          STOP_BUFFER="${{ inputs.stop_buffer_minutes || 5 }}"

          mkdir -p logs bugs
          set -o pipefail
          python3 scripts/solver_fuzzing_brain.py \
            --contract contracts/solvers/z3.yml \
            run-harness \
            --tests-json "$TESTS_JSON" \
            --job-id "z3-local" \
            --job-start-time "$JOB_START" \
            --stop-buffer-minutes "$STOP_BUFFER" \
            --iterations 250 \
            --target-binary "$TARGET_BINARY" \
            --reference-binary "$HOME/.local/bin/cvc5" \
            --bugs-folder bugs \
            |& tee logs/z3-fuzzer.log

      - name: Upload local matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3-local-matrix
          path: matrix.json
          retention-days: 1

      - name: Upload fuzzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3-fuzzer-log
          path: logs/z3-fuzzer.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload bugs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3-bugs
          path: bugs
          retention-days: 1
          if-no-files-found: ignore
